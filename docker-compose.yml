version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fairtrip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fairtrip_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-fairtrip}
    ports:
      - "5432:5432"
    volumes:
      - fairtrip_pgdata:/var/lib/postgresql/data
      - ./backend/app/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fairtrip}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fairtrip}:${POSTGRES_PASSWORD:-fairtrip_dev_pw}@db:5432/${POSTGRES_DB:-fairtrip}
      BACKEND_CORS_ORIGINS: http://localhost:5173
      ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ./ml/models:/app/../ml/models

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  fairtrip_pgdata:
